[package]
name = "booker"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json= "*"
rbook = { version = "0.6.6", optional = true }
xhtml_parser = { version = "0.2.10", optional = true }
postcard = { version = "1.1.3" }
eink = { path = "../nebula_proj/libs/eink" }
comm = { git = "https://github.com/Wooker/comm.git", optional = true }

# reade = { path = "../orbit/orbit-apps/reade" }

[features]
default = ["terminal", "epub"]
terminal = []
epub = [ "rbook", "xhtml_parser" ]
"1.54" = ["comm"]
"4.2" = ["comm"]
